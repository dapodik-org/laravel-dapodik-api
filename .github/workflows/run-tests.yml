name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4, 8.3]
        laravel: [13.*, 12.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Copy .env
        run: cp .env.example .env

      - name: Setup .env from secrets
        run: |
          if [ -n "${{ secrets.DAPODIK_API_USERNAME }}" ]; then
            sed -i "s/DAPODIK_API_USERNAME=.*/DAPODIK_API_USERNAME=${{ secrets.DAPODIK_API_USERNAME }}/" .env
          fi
          if [ -n "${{ secrets.DAPODIK_API_PASSWORD }}" ]; then
            sed -i "s/DAPODIK_API_PASSWORD=.*/DAPODIK_API_PASSWORD=${{ secrets.DAPODIK_API_PASSWORD }}/" .env
          fi
          if [ -n "${{ secrets.DAPODIK_API_KODE_REGISTRASI }}" ]; then
            sed -i "s/DAPODIK_API_KODE_REGISTRASI=.*/DAPODIK_API_KODE_REGISTRASI=${{ secrets.DAPODIK_API_KODE_REGISTRASI }}/" .env
          fi
          if [ -n "${{ secrets.DAPODIK_API_NPSN }}" ]; then
            sed -i "s/DAPODIK_API_NPSN=.*/DAPODIK_API_NPSN=${{ secrets.DAPODIK_API_NPSN }}/" .env
          fi
          if [ -n "${{ secrets.DAPODIK_API_TOKEN }}" ]; then
            sed -i "s/DAPODIK_API_TOKEN=.*/DAPODIK_API_TOKEN=${{ secrets.DAPODIK_API_TOKEN }}/" .env
          fi
        shell: bash

      - name: Execute tests
        run: vendor/bin/pest --ci
